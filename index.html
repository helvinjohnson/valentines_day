<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS STYLES (Unchanged except for button max-width safety) --- */
        :root {
            --primary-color: #d6336c;
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --accent-gold: #c5a47e;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #fff0f3 0%, #ffe3e3 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-heart {
            position: absolute;
            color: rgba(214, 51, 108, 0.1);
            font-size: 2rem;
            animation: floatUp linear infinite;
            z-index: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .card-container {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 500px;
            width: 90%;
            transition: opacity 0.3s ease;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        p.subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 32px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            /* Added safety to prevent overflow on small screens */
            max-width: 90vw; 
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-yes {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 15px rgba(214, 51, 108, 0.3);
            z-index: 2;
        }

        .btn-yes:hover {
            transform: scale(1.05);
            background: #b02656;
        }

        .btn-no {
            background: transparent;
            color: #888;
            border: 1px solid #ddd;
            position: relative; 
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .overlay.active { opacity: 1; pointer-events: all; }

        .overlay-content {
            text-align: center;
            animation: slideUp 1s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .photo-frame {
            width: 250px; height: 250px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
        
        .overlay h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .music-control {
            position: fixed; bottom: 20px; right: 20px; z-index: 50;
            background: rgba(255,255,255,0.7);
            padding: 10px; border-radius: 50%;
            cursor: pointer; transition: 0.3s;
            display: none; /* Hidden initially */
        }
        .music-control.show { display: block; }
        .music-control:hover { background: #fff; }

    </style>
</head>
<body>

    <div id="bg-container"></div>

    <div class="card-container" id="mainCard">
        <h1>Will you be my<br>Valentine?</h1>
        <p class="subtitle">I have a question only you can answer...</p>
        
        <div class="btn-group">
            <button class="btn-yes" id="yesBtn" onclick="handleYesClick()">Yes ❤️</button>
            <button class="btn-no" id="noBtn" onmouseover="handleNoInteraction()" ontouchstart="handleNoInteraction()">No 💔</button>
        </div>
    </div>

    <div class="overlay" id="successOverlay">
        <div class="overlay-content">
            <div class="photo-frame">
                <img src="https://images.unsplash.com/photo-1518568814500-bf0f8d125f46?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Us">
            </div>
            <h2>You just made my<br>Valentine's Day perfect ❤️</h2>
            <p style="font-size: 1.2rem; color: #555; margin-top: 10px;">I knew you would say yes!</p>
        </div>
    </div>

    <div id="youtube-audio-player" style="position: absolute; top: -9999px; left: -9999px;"></div>

    <div class="music-control" id="musicToggle" onclick="toggleMusic()">🎵</div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const overlay = document.getElementById('successOverlay');
        const mainCard = document.getElementById('mainCard');
        const musicToggleBtn = document.getElementById('musicToggle');
        
        let isMusicPlaying = false;
        let player; // YouTube player instance

        /* --- BACKGROUND HEARTS --- */
        function createHearts() {
            const container = document.getElementById('bg-container');
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.classList.add('bg-heart');
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 3 + 4 + 's'; 
                heart.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(heart);
            }
        }
        createHearts();

        /* --- YOUTUBE API SETUP --- */
        // 1. Load the IFrame Player API code asynchronously.
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 2. This function creates an <iframe> (and YouTube player)
        //    after the API code downloads.
        const youtubeVideoId = 'NZGHXy1IAHM'; // Your specific song ID

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-audio-player', {
                height: '1', // Tiny size to hide video
                width: '1',
                videoId: youtubeVideoId,
                playerVars: {
                    'autoplay': 0,     // Don't play yet
                    'controls': 0,     // No YouTube controls
                    'loop': 1,         // Loop the video
                    'playlist': youtubeVideoId, // Required for looping single video
                    'showinfo': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        // 3. The API will call this function when the video player is ready.
        function onPlayerReady(event) {
            // Player ready. Waiting for user click.
            // We set volume lower initially so it's not jarring
            event.target.setVolume(70); 
        }


        /* --- INTERACTIVE NO BUTTON LOGIC --- */
        // EDITED: Shortened longer phrases to prevent overflow
        const phrases = [
            "No 💔",
            "Are you sure?",
            "Really sure?",
            "Think again!",
            "Last chance!",
            "Surely not?",
            "Regret this!",
            "Reconsider!",
            "Absolutely certain?",
            "Mistake!",
            "Have a heart!",
            "Don't be cold!",
            "Change of heart?",
            "Final answer?",
            "Breaking my heart!",
        ];
        
        let noCount = 0;

        function handleNoInteraction() {
            noCount++;
            
            // 1. Move the NO button
            const btnRect = noBtn.getBoundingClientRect();
            noBtn.style.position = 'fixed'; 

            // Calculate boundaries (ensure it stays mostly on screen)
            const margin = 30; 
            const maxWidth = window.innerWidth - btnRect.width - margin;
            const maxHeight = window.innerHeight - btnRect.height - margin;

            const randomX = Math.random() * (maxWidth - margin) + margin;
            const randomY = Math.random() * (maxHeight - margin) + margin;

            // Ensure positive coordinates
            noBtn.style.left = Math.max(margin, randomX) + 'px';
            noBtn.style.top = Math.max(margin, randomY) + 'px';

            // 2. Change text (using shortened list)
            const textIndex = noCount % phrases.length;
            noBtn.innerText = phrases[textIndex];

            // 3. Grow YES button
            const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            const newSize = currentSize * 1.3; 
            yesBtn.style.fontSize = newSize + 'px';
            const currentPadding = parseFloat(window.getComputedStyle(yesBtn).paddingTop);
            yesBtn.style.padding = (currentPadding * 1.2) + 'px ' + (currentPadding * 2.5) + 'px';
        }

        /* --- YES BUTTON LOGIC --- */
        function handleYesClick() {
            mainCard.style.opacity = '0';
            setTimeout(() => {
                mainCard.style.display = 'none';
                overlay.classList.add('active');
                createExplosion();
                
                // START YOUTUBE AUDIO HERE
                if (player && typeof player.playVideo === 'function') {
                    player.playVideo();
                    isMusicPlaying = true;
                    // Show the music toggle button now that music is active
                    musicToggleBtn.classList.add('show');
                }
            }, 300);
        }

        /* --- MUSIC TOGGLE (Youtube version) --- */
        function toggleMusic() {
            if (!player || typeof player.playVideo !== 'function') return;

            if (isMusicPlaying) {
                player.pauseVideo();
                isMusicPlaying = false;
                musicToggleBtn.style.opacity = '0.5'; // Dim button when paused
            } else {
                player.playVideo();
                isMusicPlaying = true;
                musicToggleBtn.style.opacity = '1';
            }
        }

        /* --- CONFETTI --- */
        function createExplosion() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = '10px'; confetti.style.height = '10px';
                confetti.style.backgroundColor = ['#ff0', '#f00', '#0f0', '#00f'][Math.floor(Math.random() * 4)];
                confetti.style.left = '50%'; confetti.style.top = '50%';
                confetti.style.zIndex = '200';
                confetti.style.transition = 'all 1s ease-out';
                document.body.appendChild(confetti);
                setTimeout(() => {
                    confetti.style.transform = `translate(${Math.random() * 400 - 200}px, ${Math.random() * 400 - 200}px) rotate(${Math.random() * 360}deg)`;
                    confetti.style.opacity = '0';
                }, 10);
                setTimeout(() => confetti.remove(), 1000);
            }
        }
    </script>
</body>
</html>
